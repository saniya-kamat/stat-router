}

/* ── FT TEST NAMES ───────────────────────────────────────────── */
const FT_TEST_NAMES = {
  mann_kendall_test:'Mann–Kendall', linear_regression_test:'Linear Regression',
  t_test:'Welch T-Test', mann_whitney_test:'Mann–Whitney U',
  anova_test:'One-Way ANOVA', kruskal_wallis_test:'Kruskal–Wallis',
  difference_in_differences:'Diff-in-Differences',
  interrupted_time_series:'Interrupted Time Series',
  detect_change_point:'Change Point Detection',
  z_test:'Z-Test (Anomaly)', chi_square_test:'Chi-Square',
  ks_test:'Kolmogorov–Smirnov',
};

/* ── RESULTS ─────────────────────────────────────────────────── */
let resolvedTest = null;

function clearResults() {
  if (chartInst) { chartInst.destroy(); chartInst = null; }
  document.getElementById('resultsPanel').innerHTML = `
    <div class="results-empty">
      <div class="results-empty-icon">◈</div>
      <div class="results-empty-text">Awaiting run</div>
    </div>`;
}

function showErrorResults(msg) {
  document.getElementById('resultsPanel').innerHTML = `
    <div class="results-empty">
      <div class="results-empty-icon" style="color:var(--red)">✕</div>
      <div class="results-empty-text" style="color:var(--red);max-width:260px;text-align:center;line-height:1.6">${msg}</div>
    </div>`;
}

function fmtNum(v) {
  if (typeof v !== 'number') return String(v);
  if (Number.isNaN(v))  return 'n/a';
  if (!isFinite(v))     return v > 0 ? '∞' : '−∞';
  if (Math.abs(v) < 0.0001 && v !== 0) return v.toExponential(4);
  return parseFloat(v.toFixed(6)).toString();
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 4000);
}

/* ── PLAIN ENGLISH ───────────────────────────────────────────── */
function buildPlainEnglish(testId, result, raw) {
  const p    = result.p_value;
  const sig  = p !== undefined ? p < alpha : result.significant;
  const pStr = p !== undefined ? (p < 0.0001 ? p.toExponential(2) : p.toFixed(4)) : null;
  const sigStr = sig ? `below our significance threshold of α = ${alpha}, providing strong statistical evidence`
                     : `above our significance threshold of α = ${alpha}, so we cannot rule out that this result is due to chance`;

  if (testId === 'linear_regression_test') {
    const slope    = result.slope ?? result.b1;
    const r2       = result.r_squared ?? result.r2;
    const dir      = slope > 0 ? 'positive (upward)' : 'negative (downward)';
    const change   = slope > 0 ? 'increases' : 'decreases';
    const slopeStr = slope !== undefined ? Math.abs(slope).toFixed(4) : '?';
    const r2Str    = r2 !== undefined ? (r2 * 100).toFixed(1) : null;
    const hypDir   = raw._hypothesisDirection;
    let text = `The regression found a ${dir} slope of approximately ${slopeStr}, meaning the metric ${change} by about ${slopeStr} per unit of time.`;
    if (r2Str) text += ` The model explains ${r2Str}% of the variation in the data.`;
    if (pStr)  text += ` The p-value (${pStr}) is ${sigStr}.`;
    if (hypDir && sig) {
      const matches = (slope > 0 && hypDir === 'increasing') || (slope < 0 && hypDir === 'decreasing');
      text += matches
        ? ` This confirms the hypothesised ${hypDir} direction.`
        : ` Note: the data trend is ${slope > 0 ? 'increasing' : 'decreasing'}, which is the opposite of the stated hypothesis.`;
    }
    return text;
  }
  if (testId === 'mann_kendall_test') {
    const tau    = result.tau ?? result.kendall_tau;
    const dir    = tau > 0 ? 'upward (increasing)' : tau < 0 ? 'downward (decreasing)' : 'flat';
    const hypDir = raw._hypothesisDirection;
    let text = `The Mann–Kendall test detected an overall ${dir} trend in your data.`;
    if (tau !== undefined) text += ` The Kendall τ statistic was ${tau.toFixed(3)}.`;
    if (pStr) text += ` The p-value (${pStr}) is ${sigStr}${sig ? `, confirming a statistically significant ${dir} trend` : ', so this trend is not statistically significant'}.`;
    if (hypDir && sig) {
      const matches = (tau > 0 && hypDir === 'increasing') || (tau < 0 && hypDir === 'decreasing');
      if (!matches) text += ` This contradicts the hypothesised ${hypDir} direction.`;
    }
    return text;
  }
  if (testId === 't_test') {
    const [lA, lB] = getGroupLabels(raw);
    const ga    = raw.group_a ?? [];
    const gb    = raw.group_b ?? [];
    const meanA = ga.length ? (ga.reduce((a, b) => a + b, 0) / ga.length) : null;
    const meanB = gb.length ? (gb.reduce((a, b) => a + b, 0) / gb.length) : null;
    const higher = meanA !== null && meanB !== null ? (meanA > meanB ? lA : lB) : null;
    const pctDiff = (meanA && meanB) ? Math.abs((meanA - meanB) / meanB * 100).toFixed(1) : null;
    const t     = result.t_statistic ?? result.statistic;
    let text = `The Welch t-test compared the means of ${lA} and ${lB}.`;
    if (meanA !== null && meanB !== null) {
      text += ` ${lA} averaged ${meanA.toFixed(2)} vs ${lB} at ${meanB.toFixed(2)}`;
      if (pctDiff) text += ` — a ${pctDiff}% difference, with ${higher} being higher`;
      text += '.';
    }
    if (Number.isFinite(t)) text += ` The t-statistic was ${t.toFixed(3)}.`;
    if (pStr) text += ` The p-value (${pStr}) is ${sigStr}${sig ? `, meaning ${higher ? `${higher} is significantly ${higher === lA ? 'higher' : 'lower'}` : 'there is a real difference between the groups'}` : ', so the observed difference may be due to chance'}.`;
    return text;
  }
  if (testId === 'mann_whitney_test') {
    const [lA, lB] = getGroupLabels(raw);
    const ga    = raw.group_a ?? [];
    const gb    = raw.group_b ?? [];
    const medA  = ga.length ? [...ga].sort((a,b)=>a-b)[Math.floor(ga.length/2)] : null;
    const medB  = gb.length ? [...gb].sort((a,b)=>a-b)[Math.floor(gb.length/2)] : null;
    const higher = medA !== null && medB !== null ? (medA > medB ? lA : lB) : null;
    const u = result.u_statistic ?? result.statistic;
    let text = `The Mann–Whitney U test compared ${lA} and ${lB} without assuming normality.`;
    if (medA !== null && medB !== null) text += ` Median values: ${lA} = ${medA.toFixed(2)}, ${lB} = ${medB.toFixed(2)}${higher ? ` (${higher} is higher)` : ''}.`;
    if (u !== undefined) text += ` The U statistic was ${u.toFixed(1)}.`;
    if (pStr) text += ` The p-value (${pStr}) is ${sigStr}${sig ? `, suggesting ${higher ? `${higher} has a significantly ${higher === lA ? 'higher' : 'lower'} distribution` : 'a meaningful difference between the groups'}` : ', so we cannot conclude the groups differ significantly'}.`;
    return text;
  }
  if (testId === 'anova_test') {
    const f = result.f_statistic ?? result.statistic;
    const _gKeys  = Object.keys(raw).filter(k => /^group_[a-z]$/.test(k)).sort();
    const _gData  = _gKeys.map(k => raw[k]).filter(g => Array.isArray(g) && g.length > 0);
    const _gLbls  = raw._groupLabels ?? _gData.map((_, i) => `Group ${String.fromCharCode(65 + i)}`);
    const _means  = _gData.map(g => g.reduce((s, v) => s + v, 0) / g.length);
    let text = `One-way ANOVA tests whether the means of ${_gData.length >= 2 ? _gData.length : 'three or more'} groups are equal.`;
    if (_gData.length >= 2) {
      const meanStr = _gData.map((_, i) => `${_gLbls[i]} (${_means[i].toFixed(2)})`).join(', ');
      const hiIdx   = _means.indexOf(Math.max(..._means));
      const loIdx   = _means.indexOf(Math.min(..._means));
      text += ` Group means: ${meanStr}.`;
      if (hiIdx !== loIdx) text += ` ${_gLbls[hiIdx]} is highest, ${_gLbls[loIdx]} is lowest.`;
    }
    if (Number.isFinite(f)) text += ` The F-statistic was ${f.toFixed(3)}.`;
    if (pStr) text += ` The p-value (${pStr}) is ${sigStr}${sig ? '. At least one group mean is significantly different from the others' : ', so there is insufficient evidence to conclude the group means are different'}.`;
    return text;
  }
  if (testId === 'kruskal_wallis_test') {
    const h = result.h_statistic ?? result.statistic;
    const _gKeys  = Object.keys(raw).filter(k => /^group_[a-z]$/.test(k)).sort();
    const _gData  = _gKeys.map(k => raw[k]).filter(g => Array.isArray(g) && g.length > 0);
    const _gLbls  = raw._groupLabels ?? _gData.map((_, i) => `Group ${String.fromCharCode(65 + i)}`);
    const _med    = g => { const s = [...g].sort((a, b) => a - b); return s[Math.floor(s.length / 2)]; };
    const _meds   = _gData.map(g => _med(g));
    let text = `The Kruskal–Wallis test is a non-parametric equivalent of ANOVA for three or more groups.`;
    if (_gData.length >= 2) {
      const medStr = _gData.map((_, i) => `${_gLbls[i]} (${_meds[i].toFixed(2)})`).join(', ');
      const hiIdx  = _meds.indexOf(Math.max(..._meds));
      const loIdx  = _meds.indexOf(Math.min(..._meds));
      text += ` Medians: ${medStr}.`;
      if (hiIdx !== loIdx) text += ` ${_gLbls[hiIdx]} is highest, ${_gLbls[loIdx]} is lowest.`;
    }
    if (Number.isFinite(h)) text += ` The H-statistic was ${h.toFixed(3)}.`;
    if (pStr) text += ` The p-value (${pStr}) is ${sigStr}${sig ? '. At least one group is drawn from a different distribution' : ', so there is no significant difference across the groups'}.`;
    return text;
  }
  if (testId === 'z_test') {
    const z    = result.z_score ?? result.statistic;
    const cv   = raw.current_value;
    const mean = raw.historical_mean;
    const dir  = cv > mean ? 'above' : 'below';
    const fmt4 = v => (v !== undefined && v !== null) ? parseFloat(Number(v).toFixed(4)).toString() : null;
    let text = `The Z-test checks whether the current value is unusually far from the historical baseline.`;
    if (cv !== null && cv !== undefined && mean !== null && mean !== undefined) text += ` The current value of ${fmt4(cv)} is ${dir} the historical mean of ${fmt4(mean)}.`;
    if (z !== undefined) text += ` The Z-score of ${z.toFixed(2)} tells us how many standard deviations away it sits.`;
    if (pStr) text += ` The p-value (${pStr}) is ${sigStr}${sig ? ', flagging this as a statistically significant anomaly' : ', so this deviation is within the range of normal variation'}.`;
    return text;
  }
  if (testId === 'chi_square_test') {
    const chi2 = result.chi_square_statistic ?? result.chi2 ?? result.statistic;
    const hasExp = Array.isArray(raw.expected) && raw.expected.length > 0;
    let text = `The chi-square test assesses whether observed category counts differ from what we'd expect.`;
    if (!hasExp) text += ` No expected counts were provided, so a uniform distribution was assumed.`;
    if (chi2 !== undefined) text += ` The chi-square statistic was ${Number(chi2).toFixed(3)}.`;
    if (pStr) text += ` The p-value (${pStr}) is ${sigStr}${sig ? ', meaning the observed distribution is significantly different from expected' : ', so the observed frequencies are consistent with the expected distribution'}.`;
    return text;
  }
  if (testId === 'ks_test') {
    const ks  = result.ks_statistic ?? result.statistic;
    const lA  = raw._labelA || 'Sample A';
    const lB  = raw._labelB || 'Sample B';
    const nA  = raw.sample_a?.length;
    const nB  = raw.sample_b?.length;
    let text = `The Kolmogorov–Smirnov test checks whether ${lA} and ${lB} are drawn from the same underlying distribution.`;
    if (nA && nB) text += ` Sample sizes: ${lA} = ${nA}, ${lB} = ${nB}.`;
    if (ks !== undefined) text += ` The KS statistic of ${ks.toFixed(4)} measures the maximum gap between the two empirical CDFs.`;
    if (pStr) text += ` The p-value (${pStr}) is ${sigStr}${sig ? `, indicating ${lA} and ${lB} likely come from different distributions` : `, so ${lA} and ${lB} are consistent with sharing the same distribution`}.`;
    return text;
  }
  if (testId === 'difference_in_differences') {
    const est = result.did_estimate ?? result.estimate ?? result.difference_in_differences;
    const dir = est > 0 ? 'positive' : 'negative';
    let text = `The difference-in-differences design estimates the causal effect of the intervention by comparing changes in the treatment group relative to a control group.`;
    if (est !== undefined) text += ` The estimated treatment effect is ${est > 0 ? '+' : ''}${Number(est).toFixed(2)}, a ${dir} impact.`;
    if (pStr) text += ` The p-value (${pStr}) is ${sigStr}.`;
    else text += ` Review the estimate alongside confidence intervals to assess whether the effect is meaningful.`;
    return text;
  }
  if (testId === 'interrupted_time_series') {
    const pre  = result.pre_mean  ?? result.mean_before;
    const post = result.post_mean ?? result.mean_after;
    const chg  = (pre !== undefined && post !== undefined) ? post - pre : null;
    let text = `The interrupted time series analysis splits your data at the intervention point and compares the pre- and post-intervention levels.`;
    if (pre !== undefined && post !== undefined) {
      const chgDir = chg > 0 ? 'an increase' : chg < 0 ? 'a decrease' : 'no change';
      text += ` The mean before the intervention was ${Number(pre).toFixed(2)} and after was ${Number(post).toFixed(2)} — ${chgDir} of ${chg > 0 ? '+' : ''}${Number(chg).toFixed(2)}.`;
    }
    if (pStr) text += ` The p-value (${pStr}) is ${sigStr}.`;
    return text;
  }
  if (testId === 'detect_change_point') {
    // Backend returns all_breakpoints (array) and change_point (first breakpoint or null)
    const cps = result.all_breakpoints ?? result.change_points ?? result.breakpoints;
    const first = result.change_point ?? result.all_breakpoints?.[0];
    let text = `The PELT change point detection algorithm scans the series for structural breaks where the data's level or variance shifts significantly.`;
    if (Array.isArray(cps) && cps.length > 1) {
      // all_breakpoints includes a sentinel endpoint — report all except the last
      const detected = cps.slice(0, -1);
      text += detected.length
        ? ` It identified ${detected.length} change point${detected.length > 1 ? 's' : ''} at position${detected.length > 1 ? 's' : ''} ${detected.join(', ')}.`
        : ` No statistically significant change points were detected.`;
    } else if (first != null) {
      text += ` It identified a change point at position ${first}.`;
    } else {
      text += ` No statistically significant change points were detected.`;
    }
    return text;
  }
  if (pStr) return `The test returned a p-value of ${pStr}, which is ${sigStr}.`;
  return `The test completed. Review the statistics table for detailed results.`;
}

/* ── RENDER RESULTS ──────────────────────────────────────────── */
function downloadResults() {
  if (!lastResult) return;
  const blob = new Blob([JSON.stringify(lastResult, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `statrouter-result-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function renderResults(result, raw) {
  if (chartInst) { chartInst.destroy(); chartInst = null; }
  // Store for export
  lastResult = {
    timestamp:   new Date().toISOString(),
    hypothesis:  document.getElementById('ft-hyp')?.value?.trim() || null,
    claim_type:  currentClaimType || null,
    test:        resolvedTest?.name || null,
    alpha,
    result,
  };

  const hasSig = result.significant !== undefined;
  const hasP   = result.p_value !== undefined;
  // Always respect the user's chosen alpha when a p-value is available.
  // Fall back to result.significant (backend uses 0.05) only when there is no p-value.
  const sig    = hasP ? (result.p_value < alpha) : (hasSig ? result.significant : undefined);
  const isDesc = !hasSig && !hasP;

  // Direction alignment check
  const hypDir = raw._hypothesisDirection ?? null;
  const actDir = getActualDirection(currentClaimType, resolvedTest?.test, result, raw);
  // aligned: true = matches, false = contradicts, null = no directional hypothesis or can't determine
  const dirAligned = (hypDir && actDir) ? (hypDir === actDir) : null;

  const [labelA, labelB] = getGroupLabels(raw);
  const actDirLabel = (() => {
    if (currentClaimType === 'directional') {
      return actDir === 'increasing' ? 'upward (increasing)' : actDir === 'decreasing' ? 'downward (decreasing)' : null;
    }
    if (currentClaimType === 'comparative') {
      if (actDir === 'a_higher') return `${labelA} is higher`;
      if (actDir === 'a_lower')  return `${labelA} is lower`;
    }
    return null;
  })();

  let vClass, vHead, vSub;
  if (isDesc) {
    // ITS: check for a level-shift p-value the backend may return separately
    const itsP = result.p_level_shift ?? result.p_intervention ?? null;
    if (itsP !== null) {
      const itsSig = itsP < alpha;
      vClass = itsSig ? 'sig' : 'notsig';
      vHead  = itsSig ? '✓ Significant Level Shift' : '— No Significant Level Shift';
      vSub   = itsSig
        ? `The post-intervention level is significantly different from pre-intervention (α = ${alpha}).`
        : `No statistically significant level shift detected at α = ${alpha}.`;
    } else {
      // Interrupted time series without a level-shift p-value: derive from pre/post means
      const pre  = result.pre_mean  ?? result.mean_before;
      const post = result.post_mean ?? result.mean_after;
      const hasShift = pre !== undefined && post !== undefined && pre !== post;
      vClass = hasShift ? 'sig'      : 'notsig';
      vHead  = hasShift ? '✓ Structural Shift Detected' : '— No Structural Shift Detected';
      vSub   = hasShift
        ? `Mean shifted from ${Number(pre).toFixed(2)} (pre) to ${Number(post).toFixed(2)} (post) at the intervention point.`
        : `No meaningful shift in level detected at the intervention point.`;
    }
  } else if (sig && dirAligned === false) {
    // Statistically significant — but in the opposite direction to the hypothesis
    vClass = 'contrary';
    vHead  = '✗ Significant — Opposite Direction';
    vSub   = `The effect is statistically significant (α = ${alpha}), but the data shows the ${actDirLabel ?? 'opposite direction'} — contradicting the stated hypothesis.`;
  } else if (sig) {
    vClass = 'sig';
    // If no direction was stated but we can describe what was found, do so
    const foundNote = (dirAligned === null && actDirLabel)
      ? ` The observed direction: ${actDirLabel}.`
      : '';
    vHead  = '✓ Significant Effect';
    vSub   = `Reject H₀. The observed effect is unlikely to be due to chance (α = ${alpha}).${foundNote}`;
  } else {
    vClass = 'notsig';
    const foundNote = actDirLabel ? ` The data shows a ${actDirLabel} tendency, but it does not clear the significance bar.` : '';
    vHead  = '— Insufficient Evidence';
    vSub   = `Fail to reject H₀. No statistically significant effect detected at α = ${alpha}.${foundNote}`;
  }

  let pHtml = '';
  if (hasP) {
    const pVal    = result.p_value;
    const pPct    = Math.min((pVal / 1) * 100, 100);
    const pColor  = sig ? 'var(--teal)' : 'var(--red)';
    const alphaPct = Math.min(alpha * 100, 100);
    pHtml = `
      <div class="pvalue-block">
        <div class="pvalue-header-row">
          <span class="pvalue-eyebrow">P-Value</span>
          <span class="pvalue-number">${pVal < 0.0001 ? pVal.toExponential(3) : pVal.toFixed(4)}</span>
        </div>
        <div class="pvalue-track">
          <div class="pvalue-fill" style="width:${pPct}%;background:${pColor};"></div>
          <div class="pvalue-threshold" style="left:${alphaPct}%;"></div>
        </div>
        <div style="position:relative;height:18px;">
          <span class="pvalue-threshold-label" style="left:${alphaPct}%;">α = ${alpha}</span>
        </div>
      </div>`;
  }

  const skip = new Set(['test','significant']);
  const statsRows = Object.entries(result).filter(([k]) => !skip.has(k)).map(([k,v]) => {
    let cls = '', display;
    if (Array.isArray(v))       { display = `[${v.slice(0,8).join(', ')}${v.length>8?' …':''}]`; cls = 'array'; }
    else if (typeof v==='boolean') { display = v.toString(); }
    else if (v === null)        { display = '—'; }
    else {
      display = fmtNum(v);
      if (typeof v === 'number') {
        const pos = k.includes('estimate')||k.includes('change')||k.includes('difference');
        if (pos && v > 0) cls = 'positive';
        else if (pos && v < 0) cls = 'negative';
      }
    }
    return `<div class="stat-row"><span class="stat-key">${k}</span><span class="stat-value ${cls}">${display}</span></div>`;
  }).join('');

  const hasSeries   = Array.isArray(raw.series)   && raw.series.length   > 2;
  const hasGroupA   = Array.isArray(raw.group_a)   && raw.group_a.length  > 1;
  const hasSampleA  = Array.isArray(raw.sample_a)  && raw.sample_a.length > 1;
  const hasObserved = Array.isArray(raw.observed)  && raw.observed.length > 1;
  const chartHtml   = (hasSeries || hasGroupA || hasSampleA || hasObserved)
    ? `<div class="chart-section"><div class="section-label">Visualization</div><div class="chart-wrap"><canvas id="resultChart"></canvas></div></div>`
    : '';

  const plainText = buildPlainEnglish(resolvedTest?.test, result, raw);

  document.getElementById('resultsPanel').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
      <div class="panel-eyebrow">Results — ${resolvedTest?.name}</div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-sample print-export-btn"
                style="font-size:9px;padding:5px 12px;"
                onclick="downloadResults()">↓ Download JSON</button>
        <button class="btn btn-sample print-export-btn"
                style="font-size:9px;padding:5px 12px;"
                onclick="window.print()">↓ Export PDF</button>
      </div>
    </div>
    <div class="plain-english">
      <div class="plain-english-label">Interpretation</div>
      <div class="plain-english-text">${plainText}</div>
    </div>
    <div class="verdict ${vClass}">
      <div class="verdict-label">Verdict</div>
      <div class="verdict-headline">${vHead}</div>
      <div class="verdict-sub">${vSub}</div>
    </div>
    ${pHtml}
    <div class="stats-section">
      <div class="section-label">Statistics</div>
      ${statsRows}
    </div>
    ${chartHtml}`;

  if (hasSeries)        drawSeriesChart(raw.series, raw.intervention_index, result.change_point ?? result.change_points?.[0]);
  else if (hasGroupA)   drawGroupChart(raw);
  else if (hasSampleA)  drawKSChart(raw.sample_a, raw.sample_b, raw._labelA, raw._labelB);
  else if (hasObserved) drawChiSquareChart(raw.observed, raw.expected, raw.categoryLabels);

  const isAnovaKW = ['anova_test','kruskal_wallis_test'].includes(resolvedTest?.test);
  if (isAnovaKW) {
    const groupKeys = ['group_a','group_b','group_c','group_d','group_e','group_f'];
    const validKeys = groupKeys.filter(k => Array.isArray(raw[k]) && raw[k].length > 0);
    _lastPostHocGroups = validKeys.map(k => raw[k]);
    _lastPostHocLabels = raw._groupLabels?.slice() ??
      validKeys.map((_, i) => `Group ${String.fromCharCode(65 + i)}`);
  }

  if (isAnovaKW) {
    const testLabel  = resolvedTest.test === 'anova_test' ? "Tukey's HSD" : "Dunn's Test";
    const parentTest = resolvedTest.test === 'anova_test' ? 'ANOVA' : 'Kruskal–Wallis';
    const sigContext = sig
      ? `${parentTest} found a significant overall difference. ${testLabel} identifies exactly which group pairs are driving it.`
      : `${parentTest} did not find a significant overall difference (p ≥ α). You can still run ${testLabel} to explore pairwise comparisons, though treat those results cautiously.`;
    document.getElementById('resultsPanel').insertAdjacentHTML('beforeend', `
      <div id="postHocSection" style="margin-top:18px;border-top:1px solid var(--border);padding-top:16px;">
        <div class="section-label">Post-hoc Pairwise Analysis</div>
        <div style="font-size:11px;color:var(--text-muted);margin:8px 0 12px;line-height:1.6;">${sigContext}</div>
        <button class="btn btn-sample" id="postHocBtn" onclick="runPostHoc()">Run ${testLabel} →</button>
        <div id="postHocResults"></div>
      </div>`);
  }
}

/* ── CHARTS ──────────────────────────────────────────────────── */
const SERIES_COLORS = [
  { line: '#e8a020', fill: 'rgba(232,160,32,0.10)' },
  { line: '#00c99a', fill: 'rgba(0,201,154,0.10)'  },
  { line: '#7eb3ff', fill: 'rgba(126,179,255,0.10)' },
  { line: '#ff7eb3', fill: 'rgba(255,126,179,0.10)' },
  { line: '#c4b5fd', fill: 'rgba(196,181,253,0.10)' },
];
const SCATTER_COLORS = [
  { border: '#e8a020', fill: 'rgba(232,160,32,0.55)' },
  { border: '#00c99a', fill: 'rgba(0,201,154,0.55)'  },
  { border: '#7eb3ff', fill: 'rgba(126,179,255,0.55)' },
  { border: '#ff7eb3', fill: 'rgba(255,126,179,0.55)' },
];
const CHART_OPTS = {
  responsive: true,
  plugins: { legend: { display: false } },
  scales: {
    x: { grid:{ color:'#162233' }, ticks:{ color:'#4d6880', font:{ family:'IBM Plex Mono', size:9 } } },
    y: { grid:{ color:'#162233' }, ticks:{ color:'#4d6880', font:{ family:'IBM Plex Mono', size:9 } } }
  }
};

function drawSeriesChart(series, intIdx, changePoint) {
  const c = SERIES_COLORS[0];
  const datasets = [{ data: series, borderColor: c.line, backgroundColor: c.fill, borderWidth: 1.8, pointRadius: 2, tension: 0.3, fill: true }];
  const marker = intIdx ?? changePoint ?? null;
  if (marker !== null) datasets.push({
    data: series.map((_,i) => i===marker ? Math.max(...series)*1.1 : null),
    type:'bar', backgroundColor:'rgba(0,201,154,0.15)', barThickness:2, borderColor:'#00c99a', borderWidth:1
  });
  chartInst = new Chart(
    document.getElementById('resultChart').getContext('2d'),
    { type:'line', data:{ labels:series.map((_,i)=>i), datasets }, options:CHART_OPTS }
  );
}

function drawGroupChart(raw) {
  const keys   = Object.keys(raw)
    .filter(k => /^group_[a-z]$/.test(k))
    .sort();

  const groups = keys
    .map(k => raw[k])
    .filter(g => Array.isArray(g) && g.length > 0);

  const labels = raw._groupLabels ??
    groups.map((_, i) => `Group ${String.fromCharCode(65 + i)}`);

  const datasets = [];

  groups.forEach((group, gi) => {
    const col = SCATTER_COLORS[gi % SCATTER_COLORS.length];

    // Raw observations with horizontal jitter
    datasets.push({
      label: labels[gi],
      data: group.map(v => ({
        x: gi + (Math.random() - 0.5) * 0.25,
        y: v
      })),
      backgroundColor: col.fill,
      borderColor: col.border,
      borderWidth: 1,
      pointRadius: 4
    });

    // Mean marker
    const mean =
      group.reduce((sum, v) => sum + v, 0) / group.length;

    datasets.push({
      label: `${labels[gi]} Mean`,
      data: [{ x: gi, y: mean }],
      backgroundColor: '#e8a020',
      borderColor: '#ffffff',
      borderWidth: 2,
      pointRadius: 8,
      pointStyle: 'rectRot'
    });
  });

  chartInst = new Chart(
    document.getElementById('resultChart').getContext('2d'),
    {
      type: 'scatter',
      data: { datasets },
      options: {
        ...CHART_OPTS,

        plugins: {
          legend: {
            display: true,
            labels: {
              color: '#8aa0b8',
              font: {
                family: 'IBM Plex Mono',
                size: 10
              },
              boxWidth: 10,

              // Hide mean markers from legend
              filter: item => !item.text.endsWith(' Mean')
            }
          }
        },

        scales: {
          x: {
            min: -0.5,
            max: groups.length - 0.5,

            grid: {
              color: 'rgba(255,255,255,0.05)'
            },

            ticks: {
              color: '#4d6880',
              callback: function(value) {
                return labels[value] ?? '';
              }
            }
          },

          y: {
            ...CHART_OPTS.scales.y
          }
        }
      }
    }
  );
}

// Empirical CDF overlay — more meaningful for KS test than a plain line chart
function drawKSChart(a, b, labelA, labelB) {
  const buildCDF = arr => {
    const sorted = [...arr].sort((x, y) => x - y);
    const n = sorted.length;
    return sorted.map((v, i) => ({ x: v, y: (i + 1) / n }));
  };
  const cdfA = buildCDF(a);
  const cdfB = buildCDF(b);
  const cA = SERIES_COLORS[0], cB = SERIES_COLORS[1];
  chartInst = new Chart(document.getElementById('resultChart').getContext('2d'), {
    type: 'line',
    data: {
      datasets: [
        { label: labelA || 'Sample A', data: cdfA, borderColor: cA.line, backgroundColor: 'transparent', borderWidth: 1.8, pointRadius: 2, stepped: 'before', fill: false },
        { label: labelB || 'Sample B', data: cdfB, borderColor: cB.line, backgroundColor: 'transparent', borderWidth: 1.8, pointRadius: 2, stepped: 'before', fill: false },
      ]
    },
    options: {
      ...CHART_OPTS,
      plugins: { legend: { display: true, labels: { color: '#8aa0b8', font: { family: 'IBM Plex Mono', size: 10 }, boxWidth: 10 } } },
      scales: {
        x: { ...CHART_OPTS.scales.x, type: 'linear',
             title: { display: true, text: 'Value', color: '#4d6880', font: { family: 'IBM Plex Mono', size: 9 } } },
        y: { ...CHART_OPTS.scales.y, min: 0, max: 1,
             title: { display: true, text: 'Cumulative probability', color: '#4d6880', font: { family: 'IBM Plex Mono', size: 9 } } }
      }
    }
  });
}

function drawChiSquareChart(observed, expected, categoryLabels) {
  const observedNum = observed.map(Number);

  const n = observedNum.reduce((s, v) => s + v, 0);

  const labels = (categoryLabels?.length === observedNum.length)
    ? categoryLabels
    : observedNum.map((_, i) => `Cat. ${i + 1}`);

  const exp = (Array.isArray(expected) && expected.length === observedNum.length)
    ? expected.map(Number)
    : observedNum.map(() => n / observedNum.length);

  // χ² contributions per category
  const chiContrib = observedNum.map((o, i) => {
    const e = exp[i];
    return e === 0 ? 0 : Math.pow(o - e, 2) / e;
  });

  chartInst = new Chart(
    document.getElementById('resultChart').getContext('2d'),
    {
      type: 'bar',
      data: {
        labels,
        datasets: [
          {
            label: 'Observed',
            data: observedNum,
            backgroundColor: 'rgba(232,160,32,0.55)',
            borderColor: '#e8a020',
            borderWidth: 1
          },
          {
            label: 'Expected',
            data: exp,
            backgroundColor: 'rgba(0,201,154,0.30)',
            borderColor: '#00c99a',
            borderWidth: 1
          },
          {
            label: 'Chi-square Contribution',
            data: chiContrib,
            backgroundColor: 'rgba(120,140,255,0.35)',
            borderColor: '#7a8cff',
            borderWidth: 1,
            yAxisID: 'y1'
          }
        ]
      },
      options: {
        ...CHART_OPTS,

        scales: {
          ...CHART_OPTS.scales,

          y1: {
            position: 'right',
            grid: {
              drawOnChartArea: false
            },
            title: {
              display: true,
              text: 'χ² contribution'
            }
          }
        },

        plugins: {
          legend: {
            display: true,
            labels: {
              color: '#8aa0b8',
              font: { family: 'IBM Plex Mono', size: 10 },
              boxWidth: 10
            }
          }
        }
      }
    }
  );
}

/* ── POST-HOC ────────────────────────────────────────────────── */
let _lastPostHocGroups = null;
let _lastPostHocLabels = null;

async function runPostHoc() {
  if (!_lastPostHocGroups || !resolvedTest) return;
  const isAnova  = resolvedTest.test === 'anova_test';
  const testName = isAnova ? 'tukey_hsd' : 'dunns_test';
  const label    = isAnova ? "Tukey's HSD" : "Dunn's Test";
  const btn = document.getElementById('postHocBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = `<span class="spin"></span>Running ${label}…`; }
  try {
    const res  = await fetch(`${API}/debug/run-test`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ test_name: testName, data: { groups: _lastPostHocGroups } })
    });
    const json = await res.json();
    if (json.status === 'success') { renderPostHocResults(json.result, isAnova); if (btn) btn.style.display = 'none'; }
    else { toast(`Post-hoc error: ${json.message}`); if (btn) { btn.disabled = false; btn.innerHTML = `Run ${label} →`; } }
  } catch {
    toast('Cannot reach Flask server.');
    if (btn) { btn.disabled = false; btn.innerHTML = `Run ${label} →`; }
  }
}

function renderPostHocResults(result, isAnova) {
  const pairs    = result.pairs || [];
  const anySig   = result.any_significant;
  const corrNote = result.correction ? ` · ${result.correction} corrected` : '';
  const method   = isAnova ? "Tukey's HSD" : "Dunn's Test";
  const tableRows = pairs.map(p => {
    // Remap "Group A" → actual label from the groups used in the ANOVA/KW test
    const labeledPair = p.pair.replace(/Group ([A-Z])/g, (_, letter) => {
      const idx = letter.charCodeAt(0) - 65;
      return _lastPostHocLabels?.[idx] ?? `Group ${letter}`;
    });
    const pDisplay = p.p_adj < 0.0001 ? p.p_adj.toExponential(2) : p.p_adj.toFixed(4);
    const sigBadge = p.reject ? `<span style="color:var(--teal);font-weight:500;">✓ sig</span>` : `<span style="color:var(--text-dim);">—</span>`;
    const extraStat = p.z_stat !== undefined ? `<span style="color:var(--text-muted);font-size:10px;margin-right:14px;">z = ${Number(p.z_stat).toFixed(2)}</span>` : '';
    return `<div class="stat-row"><span class="stat-key">${labeledPair}</span>
      <span style="display:flex;align-items:baseline;gap:0;">
        ${extraStat}
        <span class="stat-value" style="font-size:10px;color:var(--text-soft);width:58px;text-align:right;margin-right:14px;">p = ${pDisplay}</span>
        <span style="width:40px;text-align:right;font-size:11px;">${sigBadge}</span>
      </span></div>`;
  }).join('');
  const summary = anySig
    ? `<div style="margin-top:10px;font-size:11px;color:var(--teal);line-height:1.6;">✓ Pairs marked above are significantly different at α = ${alpha}.</div>`
    : `<div style="margin-top:10px;font-size:11px;color:var(--text-muted);line-height:1.6;">No individual pairs differ significantly after correction.</div>`;
  document.getElementById('postHocResults').innerHTML = `
    <div style="margin-top:14px;">
      <div class="section-label">${method} — Pairwise Comparisons${corrNote}</div>
      <div style="margin-top:2px;">${tableRows}</div>
      ${summary}
    </div>`;
}

/* ── HEALTH ─────────────────────────────────────────────────── */
let _healthCheckInFlight = false;
async function checkHealth() {
  if (_healthCheckInFlight) return;
  _healthCheckInFlight = true;
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  // Free-tier hosting can take up to a minute to wake from idle — give it room
  // before calling it offline, and say "waking up" instead of "error" while waiting.
  const wakingTimer = setTimeout(() => { txt.textContent = 'waking up…'; }, 2500);
  try {
    const r = await fetch(`${API}/health`, { signal:AbortSignal.timeout(45000) });
    if (r.ok) { dot.className='status-dot live'; txt.textContent='api connected'; }
    else       { dot.className='status-dot error'; txt.textContent='api error'; }
  } catch { dot.className='status-dot error'; txt.textContent='api offline'; }
  finally { clearTimeout(wakingTimer); _healthCheckInFlight = false; }
}

/* ── INIT ───────────────────────────────────────────────────── */
checkHealth();
setInterval(checkHealth, 12000);
renderFreeText();
</script>
